# The root is the `egui_hud` crate; `demo/` is its web demo, never
# published.
[workspace]
members = ["demo"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quazardous/egui_hud"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The UI library the renderers draw with.
egui-pop = { version = "0.9", default-features = false, features = ["eframe", "bundled-fonts"] }
# egui-pop's logic without egui: `when` clauses over the context keys.
egui-pop-model = "0.7"
# The slot layout engine.
egui_fit = { version = "0.1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Layout code converts between pixel coordinates, slot counts and float
# values all the time; the ranges are known, so the casts are deliberate.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
similar_names = "allow"
# Exact float comparisons are deliberate: identity checks such as a value
# exactly at its default.
float_cmp = "allow"
unreadable_literal = "allow"
module_name_repetitions = "allow"
# Errors are typed and self-describing; a "# Errors" section on every
# fallible function would repeat them. The same goes for panics, which are
# invariant checks.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"

[package]
name = "egui_hud"
version = "0.2.1"
description = "Controls as data for egui: a control's purpose, value, feel and representations, cards laid out on a slot engine, resolved in context, a value flow of gestures, and renderers on egui-pop"
keywords = ["egui", "gui", "controls", "widgets", "layout"]
categories = ["gui"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
## The renderers (panel rows, HUD chips) on egui-pop. Off, the crate is the
## model, the registry and the value flow only, with no egui.
render = ["dep:egui-pop"]
## The bench: a shelf of a host's controls, composed onto a card and
## tried live (context bar, modes, presets, the placement and reason
## pane), with egui-pop's curve editor and colour wheel for the
## integrated controls.
bench = ["render", "egui-pop/viewport"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
egui_fit.workspace = true
# `when` clauses over the context keys, without egui.
egui-pop-model.workspace = true
egui-pop = { workspace = true, optional = true }

[lints]
workspace = true
