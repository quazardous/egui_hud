[package]
name = "egui_hud_demo"
description = "A web demo of egui_hud: real controls (a mixer channel, a light) declared as data, in a box laid out by egui_fit, beside previews of what they drive"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "egui_hud_demo"
path = "src/main.rs"

[dependencies]
# The controls, the bench and its page.
egui_hud = { path = "..", features = ["render", "bench"] }
# The widgets, and egui and eframe through egui-pop's re-exports.
egui-pop.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# MIT OR Apache-2.0: the web runner's start, awaited.
wasm-bindgen-futures = "0.4"

[dev-dependencies]
# MIT OR Apache-2.0: the page run headless, with no window.
egui_kittest = "0.37"

[lints]
workspace = true
