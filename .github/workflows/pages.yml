name: Demo on the web

# Builds the demo (demo/) for the web with Trunk and deploys it to GitHub
# Pages, at the site's root. Pages must be enabled for the repository with
# "GitHub Actions" as the source. Run by hand on another branch, it builds
# without deploying.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # The toolchain rust-toolchain.toml pins is not the one the action
      # named: add the target to it.
      - run: rustup target add wasm32-unknown-unknown
      - name: Build the demo
        working-directory: demo
        run: trunk build --release --public-url /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
