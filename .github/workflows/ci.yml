name: ci

# `next` is the merge zone: the full CI runs once per push of `next` (and
# on pull requests into it); `main` only moves when promote.yml
# fast-forwards it to a commit that passed here.
on:
  push:
    branches: [next]
  pull_request:
    branches: [next]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins, with its components.
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -p egui_hud --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # The demo's tests run its page headless with egui_kittest: no window.
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked -p egui_hud --no-default-features
      - run: cargo doc --locked --no-deps -p egui_hud --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # The demo (demo/) built for the web as Pages builds it.
  demo-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # The toolchain rust-toolchain.toml pins is not the one the action
      # named: add the target to it.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p egui_hud_demo -- -D warnings
      - name: Build the demo for the web
        working-directory: demo
        run: trunk build --release
